{% extends "base.html" %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center" style="min-height:80vh;">

    <div class="card shadow-lg p-4" style="width:400px;">

        <h2 class="text-center mb-4">🎓 EduPath AI</h2>

        <form method="POST">

            <h5 class="text-center mb-3">Select Your Role</h5>

            <input type="hidden" name="role" id="role" value="teacher">

            <div class="d-flex justify-content-center mb-4">

                <button type="button" id="teacherBtn" class="btn btn-primary me-2" onclick="selectRole('teacher')">
                    👨‍🏫 Teacher
                </button>

                <button type="button" id="studentBtn" class="btn btn-outline-primary" onclick="selectRole('student')">
                    👨‍🎓 Student
                </button>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Username / Roll Number
                </label>

                <input type="text" class="form-control" name="username" required
                    placeholder="Enter Username or Roll Number">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input type="password" class="form-control" name="password" required placeholder="Enter Password">

            </div>

            <button class="btn btn-success w-100">
                🔐 Login
            </button>

        </form>

    </div>

</div>
<script>

    function selectRole(role) {

        document.getElementById("role").value = role;

        if (role == "teacher") {

            document.getElementById("teacherBtn").className = "btn btn-primary me-2";
            document.getElementById("studentBtn").className = "btn btn-outline-primary";

        }
        else {

            document.getElementById("studentBtn").className = "btn btn-primary";
            document.getElementById("teacherBtn").className = "btn btn-outline-primary me-2";

        }

    }

</script>

{% endblock %}
