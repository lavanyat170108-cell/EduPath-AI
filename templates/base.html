<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPath AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .navbar {
            background: #0d6efd;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
            font-size: 24px;
        }

        .footer {
            margin-top: 60px;
            text-align: center;
            color: gray;
            padding: 20px;
        }

        .card {
            border: none;
            border-radius: 15px;
        }

        .shadow {
            box-shadow: 0 10px 20px rgba(0, 0, 0, .08) !important;
        }
    </style>

</head>

<body>

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="/teacher">
                🎓 EduPath AI
            </a>

            <div>

                <a href="/teacher" class="btn btn-light btn-sm">
                    Dashboard
                </a>

                <a href="/students" class="btn btn-light btn-sm">
                    Students
                </a>

                <a href="/add-student" class="btn btn-success btn-sm">
                    + Add Student
                </a>

            </div>

        </div>

    </nav>

    <div class="container mt-4">

        {% block content %}

        {% endblock %}

    </div>

    <div class="footer">

        EduPath AI © 2026

    </div>

</body>

</html>
