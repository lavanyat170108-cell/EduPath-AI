{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow-lg p-4">

        <h2 class="mb-4">➕ Add Student</h2>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" name="name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Department</label>
                <input type="text" class="form-control" name="department" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Year</label>
                <input type="number" class="form-control" name="year" required>
            </div>
            <div class="mb-3">
                <label>Roll Number</label>
                <input type="text" class="form-control" name="roll_number" required>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" class="form-control" name="password" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Attendance (%)</label>
                <input type="number" class="form-control" name="attendance" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Math Marks</label>
                <input type="number" class="form-control" name="math_marks" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Science Marks</label>
                <input type="number" class="form-control" name="science_marks" required>
            </div>

            <div class="mb-3">
                <label class="form-label">English Marks</label>
                <input type="number" class="form-control" name="english_marks" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Assignments Completed</label>
                <input type="number" class="form-control" name="assignments_completed" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Late Submissions</label>
                <input type="number" class="form-control" name="late_submissions" required>
            </div>

            <button class="btn btn-success">
                💾 Save Student
            </button>

            <a href="/teacher" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
