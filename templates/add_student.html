<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow p-4">

            <h2>Add Student</h2>

            <form method="POST">

                <div class="mb-3">
                    <label>Name</label>
                    <input type="text" class="form-control" name="name" required>
                </div>

                <div class="mb-3">
                    <label>Department</label>
                    <input type="text" class="form-control" name="department" required>
                </div>

                <div class="mb-3">
                    <label>Year</label>
                    <input type="number" class="form-control" name="year" required>
                </div>
                <div class="mb-3">
                    <label>Attendance (%)</label>
                    <input type="number" class="form-control" name="attendance" required>
                </div>

                <div class="mb-3">
                    <label>Math Marks</label>
                    <input type="number" class="form-control" name="math_marks" required>
                </div>

                <div class="mb-3">
                    <label>Science Marks</label>
                    <input type="number" class="form-control" name="science_marks" required>
                </div>

                <div class="mb-3">
                    <label>English Marks</label>
                    <input type="number" class="form-control" name="english_marks" required>
                </div>

                <div class="mb-3">
                    <label>Assignments Completed</label>
                    <input type="number" class="form-control" name="assignments_completed" required>
                </div>

                <div class="mb-3">
                    <label>Late Submissions</label>
                    <input type="number" class="form-control" name="late_submissions" required>
                </div>

                <button class="btn btn-success">
                    Save Student
                </button>

            </form>

        </div>

    </div>

</body>

</html>
